<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sunday Run Club app icon: cream running shoe in motion in front of a yellow
       rising sun, on a black tile. Flat fills only, Homeroom brand palette.
       Geometry is the shared mark: unit grid drawn at scale 9.5 with the horizon
       (y=64) at y=680, whole mark kept inside the central ~76% safe area. -->
  <rect width="1024" height="1024" fill="#000000"/>
  <g transform="translate(122 620) scale(9.5) translate(-4 -64)">
    <!-- sun: half disc rising on the horizon, up and right, behind the shoe -->
    <path d="M38 64 A24 24 0 0 1 86 64 Z" fill="#FFEE6F"/>
    <!-- shoe: side view, toe right, flat silhouette -->
    <path d="M22 72 L22 55 Q22 49 28 49 L37 49 L47 57 Q55 61 66 61 Q79 62 82 67 Q84 72 80 74 L24 74 Q22 74 22 72 Z" fill="#FFFEEA"/>
    <!-- sole stripe: cut-out line across the shoe -->
    <rect x="22" y="66" width="61" height="3.5" rx="1.75" fill="#000000"/>
    <!-- motion lines: three rounded bars behind the heel -->
    <rect x="8" y="54" width="10" height="4.5" rx="2.25" fill="#FFFEEA"/>
    <rect x="4" y="62" width="14" height="4.5" rx="2.25" fill="#FFFEEA"/>
    <rect x="10" y="70" width="8" height="4.5" rx="2.25" fill="#FFFEEA"/>
  </g>
</svg>